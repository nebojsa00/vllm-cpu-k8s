apiVersion: v1
kind: Pod
metadata:
  name: model-download-test
  namespace: vllm

spec:
  restartPolicy: Never

  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

  initContainers:
    - name: model-downloader
      image: vllm-model-downloader:0.3
      imagePullPolicy: Never

      env:
        - name: MODEL_ID
          value: "HuggingFaceTB/SmolLM2-135M-Instruct"

        - name: MODEL_DIR
          value: "/models/smollm2-135m"

        - name: MODEL_REVISION
          value: "12fd25f77366fa6b3b4b768ec3050bf629380bac"

      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL

      volumeMounts:
        - name: model-storage
          mountPath: /models

  containers:
    - name: model-check
      image: vllm-model-downloader:0.3
      imagePullPolicy: Never

      command:
        - python
        - -c

      args:
        - |
          from pathlib import Path

          model_dir = Path("/models/smollm2-135m")

          required_files = [
              "config.json",
              "tokenizer_config.json",
              "tokenizer.json",
              ".download_complete",
          ]

          for filename in required_files:
              path = model_dir / filename
              assert path.is_file(), f"Missing: {filename}"
              print(f"OK: {filename}")

          weights = list(model_dir.glob("*.safetensors"))
          assert weights, "Model weights missing"

          marker = (
              model_dir / ".download_complete"
          ).read_text(encoding="utf-8").splitlines()

          assert marker == [
              "HuggingFaceTB/SmolLM2-135M-Instruct",
              "12fd25f77366fa6b3b4b768ec3050bf629380bac",
          ], "Model revision mismatch"

          print(f"OK: {len(weights)} safetensors file(s)")
          print("Model cache verified")

      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL

      volumeMounts:
        - name: model-storage
          mountPath: /models
          readOnly: true

  volumes:
    - name: model-storage
      persistentVolumeClaim:
        claimName: model-cache

