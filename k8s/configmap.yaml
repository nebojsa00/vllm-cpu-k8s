
apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-config
  namespace: vllm

data:
  MODEL_ID: "HuggingFaceTB/SmolLM2-135M-Instruct"
  MODEL_DIR: "/models/smollm2-135m"
  MODEL_REVISION: "12fd25f77366fa6b3b4b768ec3050bf629380bac"

  # Настройки API
  VLLM_HOST: "0.0.0.0"
  VLLM_PORT: "8000"

  # Ограничения для моего ноутбука с 8 ГБ RAM (пытался одолжить более мощный ноутбук, но чтож..)
  VLLM_MAX_MODEL_LEN: "512"
  VLLM_MAX_NUM_SEQS: "1"
  VLLM_MAX_NUM_BATCHED_TOKENS: "512"


  VLLM_CPU_OMP_THREADS_BIND: "nobind"
  OMP_NUM_THREADS: "4"


  VLLM_LOGGING_LEVEL: "INFO"
  VLLM_DISABLE_ACCESS_LOG: "true"
  VLLM_DISABLE_REQUEST_LOG: "true"
  VLLM_CUSTOM_MIDDLEWARE: "request_logging.SafeAccessLogMiddleware"


  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
